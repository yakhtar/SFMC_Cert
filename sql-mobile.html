<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Learning Agent - Mobile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 100%;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }
        
        .form-group select,
        .form-group textarea,
        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 16px; /* Prevents zoom on iOS */
            background: white;
        }
        
        .form-group select:focus,
        .form-group textarea:focus,
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        
        .btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(37, 99, 235, 0.3);
        }
        
        .btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #2563eb;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #f0f9ff;
            border-radius: 10px;
            border-left: 4px solid #0ea5e9;
        }
        
        .result h3 {
            color: #0c4a6e;
            margin-bottom: 15px;
        }
        
        .result-content {
            line-height: 1.6;
            color: #374151;
        }
        
        .error {
            background: #fef2f2;
            border-left-color: #ef4444;
            color: #991b1b;
        }
        
        .question-section {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
        }
        
        .question-section h4 {
            color: #1f2937;
            margin-bottom: 10px;
        }
        
        .difficulty-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        
        .difficulty-beginner { background: #d1fae5; color: #065f46; }
        .difficulty-intermediate { background: #fed7aa; color: #9a3412; }
        .difficulty-advanced { background: #fecaca; color: #991b1b; }
        
        .quick-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .quick-btn {
            padding: 12px;
            background: #f3f4f6;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quick-btn:hover, .quick-btn.active {
            background: #dbeafe;
            border-color: #2563eb;
            color: #1d4ed8;
        }
        
        /* PWA styles */
        .install-banner {
            background: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .install-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="install-banner" id="installBanner">
            📱 Add to Home Screen for easier access!
            <br><button class="install-btn" onclick="installApp()">Install App</button>
        </div>
        
        <header class="header">
            <h1>📚 SQL Learning</h1>
            <p>Your AI-powered SQL tutor</p>
        </header>
        
        <div class="card">
            <div class="quick-actions">
                <button class="quick-btn" onclick="setQuickMode('generate')">📝 New Question</button>
                <button class="quick-btn" onclick="setQuickMode('check')">✅ Check Answer</button>
            </div>
            
            <form id="sqlForm">
                <div class="form-group">
                    <label for="action">What would you like to do?</label>
                    <select id="action" name="action" required>
                        <option value="generate_question">Generate a new SQL question</option>
                        <option value="check_answer">Check my SQL answer</option>
                        <option value="generate_visual">Show visual examples</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="difficulty">Difficulty Level</label>
                    <select id="difficulty" name="difficulty">
                        <option value="beginner">🟢 Beginner</option>
                        <option value="intermediate">🟡 Intermediate</option>
                        <option value="advanced">🔴 Advanced</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="topic">SQL Topic</label>
                    <select id="topic" name="topic">
                        <option value="SELECT statements">SELECT Statements</option>
                        <option value="JOINs">JOINs</option>
                        <option value="GROUP BY">GROUP BY & Aggregations</option>
                        <option value="Subqueries">Subqueries</option>
                        <option value="Window functions">Window Functions</option>
                        <option value="CTEs">Common Table Expressions</option>
                    </select>
                </div>
                
                <div class="form-group" id="answerGroup" style="display: none;">
                    <label for="studentQuery">Your SQL Query</label>
                    <textarea id="studentQuery" name="studentQuery" rows="4" 
                             placeholder="SELECT column_name FROM table_name WHERE condition;"
                             style="font-family: 'Courier New', monospace;"></textarea>
                    <small style="color: #6b7280;">Enter your SQL query here and get instant feedback from your AI tutor!</small>
                </div>
                
                <div class="form-group" id="contextGroup" style="display: none;">
                    <input type="hidden" id="expectedQuery" name="expectedQuery" value="">
                    <input type="hidden" id="questionContext" name="questionContext" value="">
                </div>
                
                <button type="submit" class="btn" id="submitBtn">
                    🚀 Get SQL Help
                </button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Your AI tutor is thinking...</p>
            </div>
            
            <div class="result" id="result">
                <div id="resultContent"></div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://yakhtar.app.n8n.cloud/webhook/sql-learning';
        
        // Form handling
        document.getElementById('sqlForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            
            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            document.getElementById('submitBtn').disabled = true;
            
            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                displayResult(result);
                
            } catch (error) {
                displayError('Failed to connect to SQL Learning Agent. Please check your connection and try again.');
                console.error('Error:', error);
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });
        
        // Show/hide answer field based on action
        document.getElementById('action').addEventListener('change', function() {
            const answerGroup = document.getElementById('answerGroup');
            answerGroup.style.display = this.value === 'check_answer' ? 'block' : 'none';
        });
        
        // Quick action buttons
        function setQuickMode(mode) {
            const actionSelect = document.getElementById('action');
            const buttons = document.querySelectorAll('.quick-btn');
            
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (mode === 'generate') {
                actionSelect.value = 'generate_question';
            } else if (mode === 'check') {
                actionSelect.value = 'check_answer';
            }
            
            // Trigger change event
            actionSelect.dispatchEvent(new Event('change'));
        }
        
        // Display results
        function displayResult(data) {
            const result = document.getElementById('result');
            const content = document.getElementById('resultContent');
            
            console.log('Raw response:', data); // Debug log
            
            if (data.error) {
                displayError(data.message || 'Something went wrong');
                return;
            }
            
            let html = '';
            
            // Handle different response formats from N8N
            const responseData = Array.isArray(data) ? data[0] : data;
            
            if (responseData.question) {
                const difficultyClass = `difficulty-${responseData.difficulty || 'beginner'}`;
                html += `
                    <div class="question-section">
                        <h4>📝 SQL Question</h4>
                        <div class="difficulty-badge ${difficultyClass}">${responseData.difficulty || 'beginner'}</div>
                        <p><strong>Concept:</strong> ${responseData.concept || 'SQL Basics'}</p>
                        <div style="margin: 15px 0; padding: 15px; background: white; border-radius: 8px; border-left: 3px solid #2563eb;">
                            ${responseData.question}
                        </div>
                        ${responseData.schema ? `<p><strong>Schema:</strong> ${responseData.schema}</p>` : ''}
                        ${responseData.expectedQuery ? `
                            <div style="margin: 15px 0;">
                                <strong>Expected Query:</strong>
                                <pre style="background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 14px; color: #1f2937;">${responseData.expectedQuery}</pre>
                            </div>
                        ` : ''}
                        ${responseData.explanation ? `
                            <div style="margin: 15px 0;">
                                <h5>💡 Explanation:</h5>
                                <p style="line-height: 1.6;">${responseData.explanation}</p>
                            </div>
                        ` : ''}
                        ${responseData.commonMistakes ? `
                            <div style="margin: 15px 0;">
                                <h5>⚠️ Common Mistakes:</h5>
                                <p style="line-height: 1.6;">${responseData.commonMistakes}</p>
                            </div>
                        ` : ''}
                        
                        <div style="margin: 20px 0; text-align: center;">
                            <button onclick="showAnswerForm('${responseData.expectedQuery || ''}', '${responseData.question || ''}')" 
                                    style="background: #10b981; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                                💡 Try Your Answer
                            </button>
                            <button onclick="generateNewQuestion()" 
                                    style="background: #6b7280; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: 10px;">
                                🔄 New Question
                            </button>
                        </div>
                    </div>
                `;
                
                // Add sample data table if available
                if (responseData.sampleData && responseData.sampleData.tables) {
                    html += `
                        <div class="question-section">
                            <h4>📊 Sample Data</h4>
                            ${generateTableHTML(responseData.sampleData.tables)}
                        </div>
                    `;
                }
            }
            
            if (responseData.feedback) {
                const isCorrect = responseData.correct;
                const feedbackColor = isCorrect ? '#10b981' : '#f59e0b';
                const emoji = isCorrect ? '🎉' : '💪';
                const encouragement = isCorrect ? 'Great job!' : 'Keep learning!';
                
                html += `
                    <div class="question-section">
                        <h4 style="color: ${feedbackColor}">
                            ${isCorrect ? '✅' : '⚠️'} ${encouragement}
                        </h4>
                        <div style="margin: 10px 0;">
                            <strong>Score: ${responseData.score || 0}/100</strong>
                        </div>
                        <div style="margin: 15px 0; line-height: 1.6; background: #f8f9fa; padding: 15px; border-radius: 8px;">
                            ${responseData.feedback}
                        </div>
                        ${responseData.nextSuggestion ? `
                            <div style="margin: 15px 0; padding: 10px; background: #e0f2fe; border-radius: 8px; border-left: 3px solid #0288d1;">
                                <strong>💡 Next Challenge:</strong> ${responseData.nextSuggestion}
                            </div>
                        ` : ''}
                        
                        <div style="margin: 20px 0; text-align: center;">
                            <button onclick="generateNewQuestion()" 
                                    style="background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer;">
                                ${emoji} Try Another Question
                            </button>
                        </div>
                    </div>
                `;
            }
            
            if (responseData.tableStructure) {
                html += `
                    <div class="question-section">
                        <h4>📊 Visual Example</h4>
                        <div>${responseData.tableStructure}</div>
                    </div>
                `;
            }
            
            // Fallback for any response that doesn't match expected format
            if (!html && responseData) {
                html += `
                    <div class="question-section">
                        <h4>🤖 AI Response</h4>
                        <div style="margin: 15px 0; line-height: 1.6;">
                            ${JSON.stringify(responseData, null, 2).replace(/\n/g, '<br>').replace(/ /g, '&nbsp;')}
                        </div>
                    </div>
                `;
            }
            
            content.innerHTML = html || '<p>No data received. Check your N8N workflow and try again.</p>';
            result.className = 'result';
            result.style.display = 'block';
            result.scrollIntoView({ behavior: 'smooth' });
        }
        
        // Generate HTML table from sample data
        function generateTableHTML(tables) {
            if (!tables || !tables.length) return '<p>No sample data available</p>';
            
            let html = '';
            tables.forEach(table => {
                html += `
                    <div style="margin: 15px 0;">
                        <h5>${table.name}</h5>
                        <table style="width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 14px;">
                            <thead>
                                <tr style="background: #f8f9fa;">
                `;
                
                if (table.columns) {
                    table.columns.forEach(col => {
                        html += `<th style="border: 1px solid #dee2e6; padding: 8px; text-align: left;">${col}</th>`;
                    });
                }
                
                html += `
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                if (table.data) {
                    table.data.forEach(row => {
                        html += '<tr>';
                        row.forEach(cell => {
                            html += `<td style="border: 1px solid #dee2e6; padding: 8px;">${cell}</td>`;
                        });
                        html += '</tr>';
                    });
                }
                
                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            });
            
            return html;
        }
        
        function displayError(message) {
            const result = document.getElementById('result');
            const content = document.getElementById('resultContent');
            
            content.innerHTML = `
                <h3>❌ Error</h3>
                <p>${message}</p>
                <p>Make sure your N8N workflow is active and the webhook URL is correct.</p>
            `;
            result.className = 'result error';
            result.style.display = 'block';
        }
        
        // PWA Installation
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').style.display = 'block';
        });
        
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installBanner').style.display = 'none';
                    }
                    deferredPrompt = null;
                });
            }
        }
        
        // Service Worker for PWA (basic)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('data:text/javascript,console.log("SW loaded");')
                    .catch(function(err) {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
        
        // Interactive functions
        function showAnswerForm(expectedQuery, questionContext) {
            // Switch to check answer mode
            document.getElementById('action').value = 'check_answer';
            document.getElementById('expectedQuery').value = expectedQuery.replace(/'/g, "\\'");
            document.getElementById('questionContext').value = questionContext.replace(/'/g, "\\'");
            
            // Show answer input
            document.getElementById('answerGroup').style.display = 'block';
            document.getElementById('contextGroup').style.display = 'block';
            
            // Focus on answer textarea
            document.getElementById('studentQuery').focus();
            
            // Update button text
            document.getElementById('submitBtn').innerHTML = '✅ Check My Answer';
            
            // Scroll to form
            document.getElementById('answerGroup').scrollIntoView({ behavior: 'smooth' });
        }
        
        function generateNewQuestion() {
            // Reset form to generate new question
            document.getElementById('action').value = 'generate_question';
            document.getElementById('answerGroup').style.display = 'none';
            document.getElementById('contextGroup').style.display = 'none';
            document.getElementById('studentQuery').value = '';
            document.getElementById('result').style.display = 'none';
            
            // Update button text
            document.getElementById('submitBtn').innerHTML = '🚀 Get SQL Help';
            
            // Scroll to top
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Auto-focus first input on load
        window.addEventListener('load', function() {
            document.getElementById('action').focus();
        });
    </script>
</body>
</html>
