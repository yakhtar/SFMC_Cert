        let currentQuestion = 0;
        let score = 0;
        let answersGiven = [];
        let quizCompleted = false;
        let shuffledQuestions = [];

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function prepareQuestion(questionData) {
            // Create array of options with their original indices
            const optionsWithIndex = questionData.options.map((option, index) => ({
                text: option,
                originalIndex: index,
                isCorrect: index === questionData.correct
            }));
            
            // Shuffle the options
            const shuffled = shuffleArray(optionsWithIndex);
            
            // Find the new index of the correct answer
            const newCorrectIndex = shuffled.findIndex(option => option.isCorrect);
            
            // Create mapping from original indices to new indices
            const indexMapping = {};
            shuffled.forEach((option, newIndex) => {
                indexMapping[option.originalIndex] = newIndex;
            });
            
            // Update explanation text to reflect new option positions
            let updatedExplanation = questionData.explanation;
            
            // Replace letter references in explanation with updated letters
            for (let originalIndex = 0; originalIndex < questionData.options.length; originalIndex++) {
                const originalLetter = String.fromCharCode(65 + originalIndex);
                const newLetter = String.fromCharCode(65 + indexMapping[originalIndex]);
                
                // Replace references like "(A)" or " A " with new letter
                const regex = new RegExp(`\\(${originalLetter}\\)|\\b${originalLetter}\\b`, 'g');
                updatedExplanation = updatedExplanation.replace(regex, (match) => {
                    return match.includes('(') ? `(${newLetter})` : newLetter;
                });
            }
            
            return {
                ...questionData,
                options: shuffled.map(option => option.text),
                correct: newCorrectIndex,
                explanation: updatedExplanation
            };
        }

        function loadQuestion() {
            if (currentQuestion >= shuffledQuestions.length) {
                showCompletionScreen();
                return;
            }

            const question = shuffledQuestions[currentQuestion];
            const container = document.getElementById('quizContainer');
            
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-number">Question ${currentQuestion + 1} of ${shuffledQuestions.length}</div>
                    <div class="question-text">${question.question}</div>
                    <ul class="options">
                        ${question.options.map((option, index) => 
                            `<li class="option" onclick="selectOption(${index})">
                                <span class="option-label">${String.fromCharCode(65 + index)})</span>
                                <span>${option}</span>
                            </li>`
                        ).join('')}
                    </ul>
                    <div class="explanation" id="explanation">
                        <h4>✅ Correct Answer: ${String.fromCharCode(65 + question.correct)})</h4>
                        <p>${question.explanation}</p>
                    </div>
                </div>
                
                <div class="navigation">
                    <button class="btn btn-secondary" onclick="previousQuestion()" ${currentQuestion === 0 ? 'disabled' : ''}>
                        ← Previous
                    </button>
                    <div class="score-display">
                        <div style="background: linear-gradient(135deg, #4CAF50, #2196F3); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold;">
                            📊 Running Score: ${score}/${currentQuestion + (answersGiven[currentQuestion] !== undefined ? 1 : 0)} 
                            ${(currentQuestion > 0 || answersGiven[currentQuestion] !== undefined) ? `(${Math.round((score/(currentQuestion + (answersGiven[currentQuestion] !== undefined ? 1 : 0)))*100)}%)` : '(0%)'}
                        </div>
                    </div>
                    <button class="btn" id="nextBtn" onclick="nextQuestion()" disabled>
                        Next →
                    </button>
                </div>
            `;

            updateProgress();
        }

        function selectOption(selectedIndex) {
            const options = document.querySelectorAll('.option');
            const question = questions[currentQuestion];
            const explanation = document.getElementById('explanation');
            const nextBtn = document.getElementById('nextBtn');

            // Remove any previous selections
            options.forEach(option => {
                option.classList.remove('selected', 'correct', 'incorrect');
            });

            // Mark the selected option
            options[selectedIndex].classList.add('selected');

            // Show correct/incorrect styling
            options.forEach((option, index) => {
                if (index === question.correct) {
                    option.classList.add('correct');
                } else if (index === selectedIndex && index !== question.correct) {
                    option.classList.add('incorrect');
                }
            });

            // Update score - only if this is the first time answering this question
            if (answersGiven[currentQuestion] === undefined) {
                if (selectedIndex === question.correct) {
                    score++;
                }
            }

            // Record the answer
            answersGiven[currentQuestion] = selectedIndex;

            // Show explanation and enable next button
            explanation.classList.add('show');
            nextBtn.disabled = false;

            // Update score display with enhanced styling
            document.querySelector('.score-display').innerHTML = 
                `<div style="background: linear-gradient(135deg, #4CAF50, #2196F3); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold;">
                    📊 Running Score: ${score}/${currentQuestion + 1} (${Math.round(score/(currentQuestion + 1)*100)}%)
                </div>`;
        }

        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }

        function previousQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                loadQuestion();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion + 1) / shuffledQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            document.getElementById('progressText').textContent = 
                `Question ${currentQuestion + 1} of ${shuffledQuestions.length}`;
        }

        function showCompletionScreen() {
            const container = document.getElementById('quizContainer');
            const completionScreen = document.getElementById('completionScreen');
            const finalScorePercent = Math.round((score / shuffledQuestions.length) * 100);
            
            container.style.display = 'none';
            completionScreen.classList.add('show');
            
            document.getElementById('finalScore').textContent = finalScorePercent + '%';
            
            const scoreCircle = document.getElementById('scoreCircle');
            const scoreMessage = document.getElementById('scoreMessage');
            
            if (finalScorePercent >= 90) {
                scoreCircle.className = 'score-circle score-excellent';
                scoreMessage.textContent = '🌟 Outstanding! You have excellent knowledge of SFMC Content Creation & Delivery!';
            } else if (finalScorePercent >= 75) {
                scoreCircle.className = 'score-circle score-good';
                scoreMessage.textContent = '👏 Great job! You have a solid understanding of the concepts.';
            } else if (finalScorePercent >= 60) {
                scoreCircle.className = 'score-circle score-needs-improvement';
                scoreMessage.textContent = '📚 Good effort! Review the study guide and try again to improve your score.';
            } else {
                scoreCircle.className = 'score-circle score-poor';
                scoreMessage.textContent = '💪 Keep studying! Review the concepts and take the quiz again.';
            }

            // Update progress to 100%
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressText').textContent = 'Quiz Complete!';
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            answersGiven = [];
            quizCompleted = false;
            
            // Reshuffle questions and answers
            initializeQuiz();
            
            document.getElementById('quizContainer').style.display = 'block';
            document.getElementById('completionScreen').classList.remove('show');
            
            loadQuestion();
        }

        function initializeQuiz() {
            // Shuffle the questions and prepare each one with shuffled answers
            shuffledQuestions = shuffleArray(questions).map(prepareQuestion);
        }

        // Initialize the quiz
        initializeQuiz();
        loadQuestion();
    </script>
